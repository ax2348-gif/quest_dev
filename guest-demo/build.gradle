plugins { id 'com.android.application' }

android {
    namespace 'dev.quest.uidemo'
    compileSdk 34
    defaultConfig {
        applicationId 'dev.quest.guestdemo'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release {
            signingConfig signingConfigs.debug
            debuggable false
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
