plugins { id 'com.android.application' }

android {
    namespace 'dev.quest.runtime'
    compileSdk 35
    ndkVersion '27.2.12479018'
    // Private sideloaded developer runtime: SDK 28 is intentional and tested.
    lint { disable 'ExpiredTargetSdkVersion' }
    defaultConfig {
        applicationId 'dev.quest.runtime'
        minSdk 28
        targetSdk 28
        versionCode 9
        versionName '1.5.2'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
                targets 'questtelemetry', 'questhost', 'questterminal'
            }
        }
    }
    buildTypes {
        release {
            // Use a local development signing key, but do NOT enable debugging.
            signingConfig signingConfigs.debug
            debuggable false
            minifyEnabled false
        }
    }
    buildFeatures { prefab true }
    packaging { jniLibs { useLegacyPackaging true } }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies {
    implementation project(':Bcore')
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.53'
}
